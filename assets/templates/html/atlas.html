<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; line-height: 1.5; color: #222; }
    svg { max-width: 100%; height: auto; border: 1px solid #ccc; background: #f7f5ef; }
    table { border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    th { background: #eee; }
    pre { background: #f5f5f5; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>{{title}}</h1>
  <section>{{map_svg}}</section>
  <h2>地点表格</h2>
  <pre>{{table}}</pre>
  <h2>地点 JSON</h2>
  <pre>{{json}}</pre>
</body>
</html>
